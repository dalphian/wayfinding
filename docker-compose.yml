version: "3.9"

services:
  wayfinding:
    build:
      context: .
      dockerfile: Dockerfile
    image: hospital-wayfinding:latest
    container_name: hospital-wayfinding
    ports:
      - "3265:3265"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3265/"]
      interval: 30s
      timeout: 5s
      retries: 3
